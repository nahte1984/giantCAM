<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>giantCamera | v4.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #intro {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 10;
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 50vh;
            max-width: 50dvh;
            aspect-ratio: 1 / 2;
            display: none;
            cursor: pointer;
            overflow: hidden; /* 確保超出的 1px 被俐落裁切 */
        }

        canvas {
            position: absolute;
            /* 將座標、尺寸、裁切路徑(三角形)都加入 0.5 秒平滑過場，使用優雅的 ease-in-out 曲線 */
            transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        left 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        clip-path 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        -webkit-clip-path 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 初始狀態也全面導入 calc(+1px) 防護，確保第一次載入就不會有任何細縫 */
        
        /* 上方 1/4 兩個正四邊形 */
        #c1 { left: 0%; top: 0%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #dce831; }
        #c2 { left: 50%; top: 0%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #1baf53; }

        /* 中間 1/4 兩個底層矩形，透過頂層三角形覆蓋 */
        #c3 { left: 0%; top: 25%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #3611a1; }
        #c5 { left: 50%; top: 25%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #8a0ae9; }
        
        /* 頂層粉色三角形 */
        #c4 { 
            left: 0%; top: 25%; width: calc(100% + 1px); height: calc(25% + 1px); z-index: 2; 
            clip-path: polygon(50% 0, 100% 100%, 0 100%); 
            background-color: #eb55b4; 
        }

        /* 下方 1/2 背景矩形 */
        #c6 { left: 0%; top: 50%; width: calc(50% + 1px); height: calc(50% + 1px); z-index: 1; background-color: #017afd; }
        #c7 { left: 50%; top: 50%; width: calc(50% + 1px); height: calc(50% + 1px); z-index: 1; background-color: #26d1e4; }

        /* 下方中間的紅橘兩色內部矩形 */
        #c8 { left: 12.5%; top: 65.625%; width: calc(37.5% + 1px); height: calc(18.75% + 1px); z-index: 3; background-color: #f54c37; }
        #c9 { left: 50%; top: 65.625%; width: calc(37.5% + 1px); height: calc(18.75% + 1px); z-index: 3; background-color: #fe8b20; }
    </style>
</head>
<body>

    <!-- 初始畫面與圖片按鈕 -->
    <div id="intro">
        <img id="start-btn" src="giant.png" alt="giant" class="max-w-[30%] max-h-[30%] object-contain drop-shadow-xl cursor-pointer transition-all active:scale-95">
    </div>

    <!-- 相機影像處理區塊 -->
    <div id="app-container">
        <!-- 九個幾何圖形的畫布 -->
        <canvas id="c1"></canvas>
        <canvas id="c2"></canvas>
        <canvas id="c3"></canvas>
        <canvas id="c4"></canvas>
        <canvas id="c5"></canvas>
        <canvas id="c6"></canvas>
        <canvas id="c7"></canvas>
        <canvas id="c8"></canvas>
        <canvas id="c9"></canvas>
    </div>

    <video id="video-source" playsinline autoplay muted style="display: none;"></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const intro = document.getElementById('intro');
        const appContainer = document.getElementById('app-container');
        const video = document.getElementById('video-source');
        
        const canvases = Array.from({length: 9}, (_, i) => document.getElementById(`c${i+1}`));
        const contexts = canvases.map(c => c.getContext('2d', { alpha: false }));

        // 用於管理動畫插值的參數陣列
        let currentConfigs = []; // 當前正在渲染的值
        let targetConfigs = [];  // 目標值
        let startConfigs = [];   // 動畫開始時的初始值
        let animStartTime = 0;   // 動畫開始的時間點
        const ANIM_DURATION = 500; // 動畫時長 (毫秒)
        let isPlaying = false;

        document.addEventListener('touchstart', (e) => {
            if (isPlaying && e.target !== startBtn) {
                e.preventDefault(); 
            }
        }, { passive: false });

        startBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                video.play();

                video.onloadedmetadata = () => {
                    intro.style.display = 'none';
                    appContainer.style.display = 'block';
                    canvases.forEach(c => c.style.backgroundColor = 'transparent');
                    
                    // 初始化時，起點、現在、目標都設為相同數值
                    const initialConfig = generateRandomConfigs();
                    currentConfigs = JSON.parse(JSON.stringify(initialConfig));
                    targetConfigs = JSON.parse(JSON.stringify(initialConfig));
                    startConfigs = JSON.parse(JSON.stringify(initialConfig));

                    isPlaying = true;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                alert('📸🚫🤔');
                console.error(err);
            }
        });

        window.addEventListener('pointerdown', (e) => {
            if (isPlaying && e.target !== startBtn) {
                e.preventDefault(); 
                
                // 1. 將當前正在畫的數值存為起點
                startConfigs = JSON.parse(JSON.stringify(currentConfigs));
                // 2. 產生新的目標數值
                targetConfigs = generateRandomConfigs();
                // 3. 重設動畫起始時間
                animStartTime = performance.now();
                
                // 觸發外部幾何 CSS 排版的隨機動畫
                randomizeLayout();
            }
        }, { passive: false }); 

        // 產生一組 9 個全新的隨機相機參數
        function generateRandomConfigs() {
            const multipliers = Array.from({length: 15}, (_, i) => i + 1);
            for (let i = multipliers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [multipliers[i], multipliers[j]] = [multipliers[j], multipliers[i]];
            }

            let newConfigs = [];
            for (let i = 0; i < 9; i++) {
                newConfigs.push({
                    a: multipliers[i],
                    rx: Math.random(),
                    ry: Math.random()
                });
            }
            return newConfigs;
        }

        // 動態隨機變更幾何圖形排版的嚴謹計算函式
        function randomizeLayout() {
            // ============================================
            // 核心規則：統一垂直分割線 X 軸 (40% ~ 60%)
            // ============================================
            const splitX = Math.round(40 + Math.random() * 20);

            // --- 大字部位 (上半部) ---
            const splitY = Math.round(5 + Math.random() * 40); 
            const lowerHeight = 50 - splitY;

            // c1, c2 更新 X 與寬度
            const c1 = document.getElementById('c1');
            c1.style.height = `calc(${splitY}% + 1px)`;
            c1.style.width = `calc(${splitX}% + 1px)`;

            const c2 = document.getElementById('c2');
            c2.style.height = `calc(${splitY}% + 1px)`;
            c2.style.left = `${splitX}%`;
            c2.style.width = `calc(${100 - splitX}% + 1px)`;

            // c3, c5 更新 X 與寬度
            const c3 = document.getElementById('c3');
            c3.style.top = `${splitY}%`;
            c3.style.height = `calc(${lowerHeight}% + 1px)`;
            c3.style.width = `calc(${splitX}% + 1px)`;

            const c5 = document.getElementById('c5');
            c5.style.top = `${splitY}%`;
            c5.style.height = `calc(${lowerHeight}% + 1px)`;
            c5.style.left = `${splitX}%`;
            c5.style.width = `calc(${100 - splitX}% + 1px)`;

            // c4 (三角形頂點) 的頂部座標(apex)必須隨著 splitX 同步移動
            const c4 = document.getElementById('c4');
            c4.style.top = `${splitY}%`;
            c4.style.height = `calc(${lowerHeight}% + 1px)`;
            c4.style.clipPath = `polygon(${splitX}% 0, 100% 100%, 0 100%)`;
            c4.style.webkitClipPath = `polygon(${splitX}% 0, 100% 100%, 0 100%)`;


            // --- 中字部位 (下半部) ---
            const top89 = Math.round(55 + Math.random() * 15);      
            const height89 = Math.round(10 + Math.random() * 10);   
            
            // c6, c7 背景更新 X 與寬度
            const c6 = document.getElementById('c6');
            c6.style.width = `calc(${splitX}% + 1px)`;

            const c7 = document.getElementById('c7');
            c7.style.left = `${splitX}%`;
            c7.style.width = `calc(${100 - splitX}% + 1px)`;

            // c8, c9 的相鄰交界處現在是 splitX，寬度計算需防呆溢出
            // 最大安全寬度 = 確保不會超出左邊緣(splitX) 且不超出右邊緣(100 - splitX)
            const maxWidth89 = Math.min(splitX, 100 - splitX);
            const width89 = Math.round(5 + Math.random() * (maxWidth89 - 5)); // 寬度在 5% 到 最大安全值 之間              
            const left8 = splitX - width89;

            // 套用 c8 (靠在 splitX 左側)
            const el8 = document.getElementById('c8');
            el8.style.top = `${top89}%`;
            el8.style.height = `calc(${height89}% + 1px)`;
            el8.style.left = `${left8}%`;
            el8.style.width = `calc(${width89}% + 1px)`;

            // 套用 c9 (靠在 splitX 右側，與 c8 寬度相等，完美鏡像)
            const el9 = document.getElementById('c9');
            el9.style.top = `${top89}%`;
            el9.style.height = `calc(${height89}% + 1px)`;
            el9.style.left = `${splitX}%`;
            el9.style.width = `calc(${width89}% + 1px)`;
        }

        // 核心渲染迴圈 (加入時間動畫插值與即時縮放解析度計算)
        function renderLoop(now) {
            if (!isPlaying) return;

            // 計算動畫進度 (0 到 1)
            let progress = 1;
            if (animStartTime > 0) {
                progress = Math.min((now - animStartTime) / ANIM_DURATION, 1);
            }

            // 優雅的 Cubic Easing In-Out 曲線公式 (與 CSS 動畫節奏匹配)
            const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const tEased = easeInOutCubic(progress);

            // 更新當前每一格畫布的相機參數 (從 start 平滑過渡到 target)
            for (let i = 0; i < 9; i++) {
                currentConfigs[i].a = startConfigs[i].a + (targetConfigs[i].a - startConfigs[i].a) * tEased;
                currentConfigs[i].rx = startConfigs[i].rx + (targetConfigs[i].rx - startConfigs[i].rx) * tEased;
                currentConfigs[i].ry = startConfigs[i].ry + (targetConfigs[i].ry - startConfigs[i].ry) * tEased;
            }

            // [效能優化] 統一先讀取所有畫布的最新尺寸，避免導致瀏覽器重新排版(Layout Thrashing)
            const rects = canvases.map(c => c.getBoundingClientRect());
            const dpr = window.devicePixelRatio || 1;

            canvases.forEach((canvas, i) => {
                const rect = rects[i];
                // 每幀即時寫入最新解析度，這確保了動畫播放中的 0.5 秒內，影像「絕對不會」被變形拉伸
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;

                const ctx = contexts[i];
                const config = currentConfigs[i];
                
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const cw = canvas.width;
                const ch = canvas.height;

                if (vw === 0 || vh === 0 || cw === 0 || ch === 0) return;

                const cr = cw / ch;
                let mw, mh;
                if (vw / vh > cr) {
                    mh = vh;
                    mw = vh * cr;
                } else {
                    mw = vw;
                    mh = vw / cr;
                }

                const sw = mw / config.a;
                const sh = mh / config.a;

                const min_cx = sw / 2;
                const max_cx = vw - sw / 2;
                const min_cy = sh / 2;
                const max_cy = vh - sh / 2;

                const cx = min_cx + config.rx * (max_cx - min_cx);
                const cy = min_cy + config.ry * (max_cy - min_cy);

                const sx = cx - sw / 2;
                const sy = cy - sh / 2;

                // 稍微向外繪製 1px 填滿 Canvas 內部的次像素邊緣
                ctx.drawImage(video, sx, sy, sw, sh, -1, -1, cw + 2, ch + 2);
            });

            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
