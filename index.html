<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>giantCamera | v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #intro {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 10;
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 50vh;
            max-width: 50dvh;
            aspect-ratio: 1 / 2;
            display: none;
            cursor: pointer;
            overflow: hidden; /* 確保超出的 1px 被俐落裁切 */
        }

        canvas {
            position: absolute;
        }

        /* 初始狀態也全面導入 calc(+1px) 防護，確保第一次載入就不會有任何細縫 */
        
        /* 上方 1/4 兩個正四邊形 */
        #c1 { left: 0%; top: 0%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #dce831; }
        #c2 { left: 50%; top: 0%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #1baf53; }

        /* 中間 1/4 兩個底層矩形，透過頂層三角形覆蓋 */
        #c3 { left: 0%; top: 25%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #3611a1; }
        #c5 { left: 50%; top: 25%; width: calc(50% + 1px); height: calc(25% + 1px); z-index: 1; background-color: #8a0ae9; }
        
        /* 頂層粉色三角形 */
        #c4 { 
            left: 0%; top: 25%; width: calc(100% + 1px); height: calc(25% + 1px); z-index: 2; 
            clip-path: polygon(50% 0, 100% 100%, 0 100%); 
            background-color: #eb55b4; 
        }

        /* 下方 1/2 背景矩形 */
        #c6 { left: 0%; top: 50%; width: calc(50% + 1px); height: calc(50% + 1px); z-index: 1; background-color: #017afd; }
        #c7 { left: 50%; top: 50%; width: calc(50% + 1px); height: calc(50% + 1px); z-index: 1; background-color: #26d1e4; }

        /* 下方中間的紅橘兩色內部矩形 */
        #c8 { left: 12.5%; top: 65.625%; width: calc(37.5% + 1px); height: calc(18.75% + 1px); z-index: 3; background-color: #f54c37; }
        #c9 { left: 50%; top: 65.625%; width: calc(37.5% + 1px); height: calc(18.75% + 1px); z-index: 3; background-color: #fe8b20; }
    </style>
</head>
<body>

    <!-- 初始畫面與圖片按鈕 -->
    <div id="intro">
        <img id="start-btn" src="giant.png" alt="giant" class="max-w-[30%] max-h-[30%] object-contain drop-shadow-xl cursor-pointer transition-all active:scale-95">
    </div>

    <!-- 相機影像處理區塊 -->
    <div id="app-container">
        <!-- 九個幾何圖形的畫布 -->
        <canvas id="c1"></canvas>
        <canvas id="c2"></canvas>
        <canvas id="c3"></canvas>
        <canvas id="c4"></canvas>
        <canvas id="c5"></canvas>
        <canvas id="c6"></canvas>
        <canvas id="c7"></canvas>
        <canvas id="c8"></canvas>
        <canvas id="c9"></canvas>
    </div>

    <video id="video-source" playsinline autoplay muted style="display: none;"></video>

    <script>
        const startBtn = document.getElementById('start-btn');
        const intro = document.getElementById('intro');
        const appContainer = document.getElementById('app-container');
        const video = document.getElementById('video-source');
        
        const canvases = Array.from({length: 9}, (_, i) => document.getElementById(`c${i+1}`));
        const contexts = canvases.map(c => c.getContext('2d', { alpha: false }));

        let configs = [];
        let isPlaying = false;

        document.addEventListener('touchstart', (e) => {
            if (isPlaying && e.target !== startBtn) {
                e.preventDefault(); 
            }
        }, { passive: false });

        startBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                video.play();

                video.onloadedmetadata = () => {
                    intro.style.display = 'none';
                    appContainer.style.display = 'block';
                    
                    canvases.forEach(c => c.style.backgroundColor = 'transparent');
                    
                    resizeCanvases();
                    initConfigs();
                    isPlaying = true;
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                alert('📸🚫 無法開啟相機，請確認設備是否有後置鏡頭並允許權限。');
                console.error(err);
            }
        });

        window.addEventListener('pointerdown', (e) => {
            if (isPlaying && e.target !== startBtn) {
                e.preventDefault(); 
                
                initConfigs();
                randomizeLayout();
                resizeCanvases(); // 重算畫布大小，確保無縫更新
            }
        }, { passive: false }); 

        function initConfigs() {
            const multipliers = Array.from({length: 15}, (_, i) => i + 1);
            for (let i = multipliers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [multipliers[i], multipliers[j]] = [multipliers[j], multipliers[i]];
            }

            configs = [];
            for (let i = 0; i < 9; i++) {
                configs.push({
                    a: multipliers[i],
                    rx: Math.random(),
                    ry: Math.random()
                });
            }
        }

        // 動態隨機變更幾何圖形排版的嚴謹計算函式 (已導入整數化與 +1px 修補法)
        function randomizeLayout() {
            // --- 大字部位 ---
            // 使用 Math.round() 強制取整數，消滅 99% 的浮點數渲染誤差
            const splitY = Math.round(5 + Math.random() * 40); 
            const lowerHeight = 50 - splitY;

            // c1, c2 高度套用 splitY，並強制 +1px 完美覆蓋接縫
            document.getElementById('c1').style.height = `calc(${splitY}% + 1px)`;
            document.getElementById('c2').style.height = `calc(${splitY}% + 1px)`;

            // c3, c4, c5 起點為 splitY，高度為 lowerHeight 並強制 +1px
            const els345 = ['c3', 'c4', 'c5'];
            els345.forEach(id => {
                const el = document.getElementById(id);
                el.style.top = `${splitY}%`;
                el.style.height = `calc(${lowerHeight}% + 1px)`;
            });

            // --- 中字部位 ---
            // 同樣使用 Math.round() 取整數
            const top89 = Math.round(55 + Math.random() * 15);      
            const height89 = Math.round(10 + Math.random() * 10);   
            
            const left8 = Math.round(10 + Math.random() * 30);      
            const width89 = 50 - left8;                 

            // 套用 c8 (加上 1px 消除左右與上下接縫)
            const el8 = document.getElementById('c8');
            el8.style.top = `${top89}%`;
            el8.style.height = `calc(${height89}% + 1px)`;
            el8.style.left = `${left8}%`;
            el8.style.width = `calc(${width89}% + 1px)`;

            // 套用 c9 (固定從正中央50%起算，完美鏡像)
            const el9 = document.getElementById('c9');
            el9.style.top = `${top89}%`;
            el9.style.height = `calc(${height89}% + 1px)`;
            el9.style.left = `50%`;
            el9.style.width = `calc(${width89}% + 1px)`;
        }

        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            canvases.forEach(c => {
                const rect = c.getBoundingClientRect();
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
            });
        }

        window.addEventListener('resize', () => {
            if (isPlaying) resizeCanvases();
        });

        function renderLoop() {
            if (!isPlaying) return;

            canvases.forEach((canvas, i) => {
                const ctx = contexts[i];
                const config = configs[i];
                
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const cw = canvas.width;
                const ch = canvas.height;

                if (vw === 0 || vh === 0 || cw === 0 || ch === 0) return;

                const cr = cw / ch;
                let mw, mh;
                if (vw / vh > cr) {
                    mh = vh;
                    mw = vh * cr;
                } else {
                    mw = vw;
                    mh = vw / cr;
                }

                const sw = mw / config.a;
                const sh = mh / config.a;

                const min_cx = sw / 2;
                const max_cx = vw - sw / 2;
                const min_cy = sh / 2;
                const max_cy = vh - sh / 2;

                const cx = min_cx + config.rx * (max_cx - min_cx);
                const cy = min_cy + config.ry * (max_cy - min_cy);

                const sx = cx - sw / 2;
                const sy = cy - sh / 2;

                // 稍微向外繪製 1px 填滿 Canvas 內部的次像素邊緣
                ctx.drawImage(video, sx, sy, sw, sh, -1, -1, cw + 2, ch + 2);
            });

            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
